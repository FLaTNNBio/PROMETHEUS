[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-dual-application"
version = "0.8.1"
description = "Uncertainty-aware ordinal contrastive causal ranking for population health allocation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["causal_population_ranking*"]
