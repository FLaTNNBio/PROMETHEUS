base_config: configs/prometheus/dm77_integrated_smoke.yaml

# These seeds are deliberately distinct from the 17/37/71 discovery seeds used
# by dm77_method_ablation_suites.yaml.  The suites below validate complete
# configurations; they do not infer a joint optimum from marginal ablations.
default_seeds: [101, 131, 151, 181, 211]

suites:
  holdout_default:
    dgp_scenario: [baseline_identifiable]

  holdout_outcome_regression_default_pairs:
    dgp_scenario: [baseline_identifiable]
    causal_signal_estimator: [outcome_regression]

  holdout_dr_robust_cross:
    dgp_scenario: [baseline_identifiable]
    causal_signal_estimator: [dr]
    causal_signal_aggregation: [median]
    causal_signal_winsorize: [false]
    causal_signal_reliability: [false]
    min_direction_agreement: [0.60]
    beta_cross: [1.00]

  holdout_or_mean_robust_cross:
    dgp_scenario: [baseline_identifiable]
    causal_signal_estimator: [outcome_regression]
    causal_signal_aggregation: [mean]
    causal_signal_winsorize: [true]
    causal_signal_reliability: [true]
    min_direction_agreement: [0.60]
    beta_cross: [1.00]
