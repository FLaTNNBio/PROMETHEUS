opportunity_source: synthetic_legacy
run:
  seed: 7
  scenario: baseline
  sample_size: 800
  device: cpu
  output_root: artifacts/prometheus_global_smoke
data:
  source: fully_synthetic
  cohort_cache: null
  synthetic:
    generator: structured_longitudinal_population_v1
    population_profile: methodological_adult_population_v1
    scenario: baseline
    seed_offset: 100000
    reference_date: 2025-01-01
    history_months: 24
    minimum_age: 18
    maximum_age: 100
    write_monthly_history: true
simulation:
  outcome_horizon_days: 365
  treatment_levels: 6
  outcome_noise_sd: 6.0
  shared_effect_correlation: 0.50
  overlap_strength: 1.50
  risk_benefit_alignment: 0.0
  transition_sample_imbalance: 1.0
  transition_effect_scales: {1_to_2: 1.0, 2_to_3: 1.0, 3_to_4: 1.0, 4_to_5: 1.0, 5_to_6: 1.0}
  eligibility: {mode: synthetic_clinical}
dm77:
  enabled: true
  config_path: configs/dm77/default.yaml
  intervention_catalog: configs/dm77/intervention_catalog.yaml
  use_level_as_ranker_feature: false
  use_level_as_treatment: false
nuisance:
  folds: 2
  repeats: 3
  repeat_seed_stride: 1009
  model: linear
prometheus:
  training_mode: prometheus_global_causal_contrastive
  within_pairs_per_epoch: 150
  cross_pairs_per_epoch: 150
  beta_cross: 0.50
  validation_beta_cross: 0.50
  min_signal_gap_days: 2.0
  min_pair_direction_agreement: 0.66
  balance_transition_pairs: true
  allow_same_patient_cross_pairs: true
  contrastive_pairs_per_epoch: 150
  lambda_con: 0.10
  lambda_reg: 0.000001
  contrastive_margin: 1.0
  positive_max_gap_days: 3.0
  negative_min_gap_days: 15.0
  propensity_clip_epsilon: 0.02
  dr_signal_aggregation: median
  pair_reliability_weighting: {enabled: false, max_weight: 25.0}
  calibration: {method: isotonic, pooled_for_global_models: true}
  epochs: 1
  batch_size: 64
  hidden_dim: 16
  latent_dim: 8
  learning_rate: 0.001
  patience: 1
allocation:
  shared_budget: 100.0
  transition_costs: {1_to_2: 1.0, 2_to_3: 1.5, 3_to_4: 2.0, 4_to_5: 3.0, 5_to_6: 4.0}
  transition_capacities: null
  require_empirical_support: true
  propensity_support: {lower: 0.05, upper: 0.95}
  allocate_negative_predicted_benefit: false
  exact_solver: true
  solver_time_limit_seconds: 60.0
