base_config: configs/prometheus/prometheus_causal_contrastive.yaml
default_seeds: [11, 23, 37, 53, 71]
suites:
  shared_learning:
    shared_effect_correlation: [0.0, 0.25, 0.50, 0.75, 1.0]
    transition_imbalance_rho: [0.75]
    overlap_strength: [0.5]
    risk_benefit_alignment: [0.0]
    training_mode: [independent_rankers, unified_rank_only]
  imbalance:
    shared_effect_correlation: [0.75]
    transition_imbalance_rho: [1.0, 0.75, 0.50]
    overlap_strength: [0.5]
    risk_benefit_alignment: [0.0]
    training_mode: [independent_rankers, unified_rank_only]
  contrastive_ablation:
    shared_effect_correlation: [0.50]
    transition_imbalance_rho: [0.75]
    overlap_strength: [0.5]
    risk_benefit_alignment: [0.0]
    training_mode:
      - independent_rankers
      - unified_rank_only
      - unified_random_contrastive
      - unified_covariate_contrastive
      - prometheus_causal_contrastive
  risk_benefit_misalignment:
    shared_effect_correlation: [0.50]
    transition_imbalance_rho: [0.75]
    overlap_strength: [0.5]
    risk_benefit_alignment: [-0.5, 0.0, 0.5]
    training_mode: [independent_rankers, unified_rank_only, prometheus_causal_contrastive]
  overlap_stress:
    shared_effect_correlation: [0.50]
    transition_imbalance_rho: [0.75]
    overlap_strength: [0.5, 1.5, 3.0]
    risk_benefit_alignment: [0.0]
    training_mode: [independent_rankers, unified_rank_only, prometheus_causal_contrastive]
  hidden_confounding_stress:
    scenario: [hidden_confounding]
    shared_effect_correlation: [0.50]
    transition_imbalance_rho: [0.75]
    overlap_strength: [1.5]
    risk_benefit_alignment: [0.0]
    training_mode: [independent_rankers, unified_rank_only, prometheus_causal_contrastive]
