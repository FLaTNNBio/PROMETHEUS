base_config: configs/prometheus/dm77_integrated_smoke.yaml
default_seeds: [17, 37, 71]

suites:
  causal_signal_estimator_ablation:
    causal_signal_estimator: [dr, outcome_regression, ipw, naive_outcome]

  causal_signal_robustness_ablation:
    causal_signal_aggregation: [median, mean]
    causal_signal_winsorize: [true, false]
    causal_signal_reliability: [true, false]

  pair_construction_ablation:
    min_direction_agreement: [0.60, 0.80, 1.00]
    beta_cross: [0.00, 0.50, 1.00]

  permuted_pair_label_control:
    permute_training_pair_labels: [false, true]

  current_care_state_ablation:
    exclude_current_care_state_features: [false, true]

  dgp_negative_controls:
    dgp_scenario: [null_treatment_effect, placebo_outcome]

  dgp_identification_stress:
    dgp_scenario: [baseline_identifiable, strong_observed_confounding, poor_overlap, risk_benefit_misalignment, targeted_selection_observed, hidden_confounding, combined_stress]
