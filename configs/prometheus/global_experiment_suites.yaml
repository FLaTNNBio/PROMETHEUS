base_config: configs/prometheus/global_default.yaml
suites:
  global_pair_ablation:
    seed: [11, 37, 71]
    scenario: [baseline]
    training_mode: [unified_local_ranker, unified_global_ranker]
  contrastive_ablation:
    seed: [11, 37, 71]
    scenario: [baseline]
    training_mode:
      - unified_global_ranker
      - global_random_contrastive
      - global_covariate_contrastive
      - prometheus_global_causal_contrastive
  stress_scenarios:
    seed: [11, 37, 71]
    scenario:
      - poor_overlap
      - hidden_confounding
      - risk_benefit_misalignment
      - combined_stress
      - cross_transition_scale_imbalance
      - transition_sample_imbalance
      - heterogeneous_transition_costs
    training_mode: [unified_global_ranker, prometheus_global_causal_contrastive]
  synthetic_population_stress:
    seed: [11, 37, 71]
    scenario: [baseline]
    synthetic_scenario:
      - baseline
      - older_high_need
      - social_fragility_shift
      - utilization_surge
      - combined_shift
    training_mode: [prometheus_global_causal_contrastive]
