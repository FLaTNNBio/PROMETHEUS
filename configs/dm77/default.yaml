assessment_version: dm77_research_operationalization_v1
threshold_profile: research_default_not_official
missing_data_policy: manual_review
required_fields:
  - age
  - condition_distinct
  - prior_inpatient
  - prior_emergency
  - medication_distinct
  - frailty_index
  - functional_limitation_score
  - social_fragility_score
  - cognitive_impairment
  - non_self_sufficiency
  - caregiver_available
  - housing_instability
  - palliative_need
exclude_level_vi_from_standard_allocation: true
exclude_manual_review_from_standard_allocation: true
thresholds:
  clinical_high: 0.60
  functional_moderate: 0.35
  functional_high: 0.75
  social_fragility: 0.45
  frailty_moderate: 0.25
  frailty_high: 0.70
  chronicity_min_conditions: 2
  high_condition_count: 5
  high_prior_inpatient: 2
